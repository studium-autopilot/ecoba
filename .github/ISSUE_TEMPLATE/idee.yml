name: Idee
description: Vorschlag für etwas Neues oder Besseres.
title: "Idee: "
labels: ["idee"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Was wünschst du dir?
      description: Beschreib kurz, was dir fehlt oder was einfacher sein könnte.
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Wofür brauchst du es?
      placeholder: "z. B. Ich will vor der Prüfungsanmeldung sehen, welche Module noch fehlen."
