<!DOCTYPE html>
<!-- Erfundene Testseite für tests/alma-konto-html.test.js und tests/alma-konto.test.js. Aufbau wie die Startseite von Alma
     nach der Anmeldung (Oktober 2026), verkleinertes Gerüst, alle Werte erfunden. Wie jede angemeldete Seite trägt sie das
     versteckte Formular #sessionTimeoutLoginForm mit den Feldern der Anmeldung und dem Satz zur abgelaufenen Sitzung;
     angemeldet erkennt man nur am Abmelde-Link (category=auth.logout). Name und Initialen im Kopf sind erfunden. -->
<html xmlns="http://www.w3.org/1999/xhtml" lang="de">
<head><meta charset="utf-8"><title>Alma</title></head>
<body>
<div id="header">
  <a class="topMenuLink mainnavLink link_simple flexdropdownmenu capitalizeFirstLetter" href="/alma/rds?state=user&amp;type=3&amp;category=auth.logout" id="widgetRender:1:burgerNavi:logoutLink">Abmelden</a>
  <form id="widgetRender:22:collapsibleHeaderActionFrom" name="widgetRender:22:collapsibleHeaderActionFrom" method="post" action="/alma/pages/cs/sys/portal/hisinoneStartPage.faces">
    <div class="widgetPanel" id="widgetRender:22:collapsibleHeaderActionFrom:avatarInfobox">
      <button class="submit_image portalInfoBoxLink short-waiting-behavior submit" id="widgetRender:22:collapsibleHeaderActionFrom:avatarInfobox:open" name="widgetRender:22:collapsibleHeaderActionFrom:avatarInfobox:open" type="button" title="Erika Musterfrau">
        <div class="avatar"><div class="initials-circle" id="avatar">EM</div></div>
      </button>
    </div>
    <a class="sLink waiting-behavior" href="/alma/rds?state=user&amp;type=3&amp;category=auth.logout" id="widgetRender:22:collapsibleHeaderActionFrom:logoutLink"><span class="iconfont-exit"></span></a>
  </form>
</div>
<form id="sessionTimeoutLoginForm" name="loginform" class="formular full-screen-waiting-behavior" method="post"
      action="https://alma.uni-tuebingen.de:443/alma/rds?state=user&amp;type=1&amp;category=auth.login&amp;re=last">
  <div class="box_content"><fieldset role="presentation">
    <legend class="noDisplay">Anmelden</legend>
    <p>Ihre Sitzung ist aus Sicherheitsgründen abgelaufen. Bitte melden Sie sich erneut an.</p>
    <label for="asdf">Benutzerkennung</label><input class="input_standard autofocus-behavior" id="asdf" name="asdf" type="text">
    <label for="fdsa">Passwort</label><input class="input_standard" id="fdsa" name="fdsa" type="password">
    <button class="submit_login" id="sessionTimeoutLoginForm:login" name="submit" type="submit"><span>Anmelden</span></button>
  </fieldset></div>
</form>
<form id="startPage" name="startPage" method="post" action="/alma/pages/cs/sys/portal/hisinoneStartPage.faces">
  <input type="hidden" name="activePageElementId" value="">
  <h1>Startseite</h1>
  <input type="hidden" name="startPage_SUBMIT" value="1">
</form>
</body>
</html>
