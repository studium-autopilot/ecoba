<html xmlns="http://www.w3.org/1999/xhtml" lang="de">
<head><meta charset="utf-8"><title>Alma</title></head>
<body>
<form id="otpForm" name="otpForm" method="post" action="https://alma.uni-tuebingen.de:443/alma/rds?state=user&amp;type=1&amp;category=auth.otp">

</form>
</body>
</html>
