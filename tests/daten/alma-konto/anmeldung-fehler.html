<!DOCTYPE html>
<!-- Erfundene Testseite für tests/alma-konto-html.test.js. Aufbau wie die Startseite von Alma nach einer abgelehnten
     Anmeldung (einmal geprüft am 18.10.2026 mit einem erfundenen Benutzernamen, den es nicht geben kann): das Formular ist
     wieder da, darüber ein Kasten „Fehler:“ mit einer Meldung. Verkleinertes Gerüst, Werte erfunden; der Wortlaut der Meldung
     ist der von Alma. -->
<html xmlns="http://www.w3.org/1999/xhtml" lang="de">
<head><meta charset="utf-8"><title>Startseite – Alma</title></head>
<body>
<form id="mobileLoginForm" name="mobileLoginForm" class="noDisplay formular full-screen-waiting-behavior" method="post"
      action="https://alma.uni-tuebingen.de:443/alma/rds?state=user&amp;type=1&amp;category=auth.login">
  <input type="hidden" name="userInfo" value="">
  <input type="hidden" id="ajaxTokenMobile" name="ajax-token" value="55555555-6666-4777-8888-999999999999">
  <label for="loginName">Benutzerkennung</label>
  <input class="input_login_hisinone" id="loginName" name="asdf" type="text">
  <label for="loginPassword">Passwort</label>
  <input class="input_login_hisinone" id="loginPassword" name="fdsa" type="password">
</form>
<form id="startPage" name="startPage" method="post" action="/alma/pages/cs/sys/portal/hisinoneStartPage.faces">
  <input type="hidden" name="activePageElementId" value="">
  <div id="startPage:messages-infobox" class="messages-infobox-container" role="dialog">
    <div class="messages-infobox-behavior  occassionalUser" data-maximum-severity="error">
      <div id="startPage:messages-infobox:j_id_1:error" data-infobox-type="Error" class="infobox error_infobox messages-infobox">
        <div class="messages-infobox-scroll-container">
          <h2 id="error_header" class="messages_infobox_header"><span class="iconfont-error_mono marginRightStandard"></span> Fehler: </h2>
          <ul class="listMessages">
            <li class="">Ihre Anmeldung war leider nicht erfolgreich. Es wurden zu viele Login-Fehlversuche registriert. Bitte nutzen Sie die "Zugangsdaten vergessen?"-Funktion. </li>
          </ul>
        </div>
        <div><button id="startPage:messages-infobox:j_id_1:error:schliessen" name="startPage:messages-infobox:j_id_1:error:schliessen" type="submit" class="simple-close-button-behavior closeButtonMessagesESC"><span>Schließen [ESC]</span></button></div>
      </div>
    </div>
  </div>
  <input type="hidden" name="startPage_SUBMIT" value="1">
</form>
</body>
</html>
