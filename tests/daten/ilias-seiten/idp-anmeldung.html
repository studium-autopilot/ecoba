<!DOCTYPE html>
<!-- Erfundene Testseite: Anmeldeformular des Shibboleth-IdP der Uni (Schritt 3 der Anmeldung). Formular wie gemessen
     (Feldnamen, relative Action), Rest gekürzt. -->
<html>
<head><meta charset="UTF-8" /><title>Shibboleth IdP</title></head>
<body>
<div class="wrapper"><div class="container"><main class="main">
<form action="/idp/profile/SAML2/Redirect/SSO?execution=e1s1" class="column left" method="post">
	<div class="form-login-element-wrapper">
		<input class="form-element form-field" id="username" name="j_username" type="text" value="">
		<label class="label-login" for="username">Username</label>
	</div>
	<div class="form-login-element-wrapper">
		<input class="form-element form-field" id="password" name="j_password" type="password" value="">
		<label class="label-login" for="password">Password</label>
	</div>
	<div class="form-element-wrapper">
		<input id="donotcache" name="donotcache" type="checkbox" value="1">
		<label for="donotcache">Don't Remember Login</label>
	</div>
	<div class="form-element-wrapper">
		<input id="_shib_idp_revokeConsent" name="_shib_idp_revokeConsent" type="checkbox" value="true">
		<label for="_shib_idp_revokeConsent">Clear prior granting of permission for release of your information to this service.</label>
	</div>
	<div class="form-element-wrapper">
		<button class="form-element form-button" name="_eventId_proceed" onclick="this.childNodes[0].nodeValue='Logging in, please wait...'" type="submit">Login</button>
	</div>
</form>
</main></div></div>
</body>
</html>
